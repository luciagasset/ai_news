# Publica las ediciones (carpeta output/) en GitHub Pages cada vez que cambian.
# La generación de cada edición se hace en local con Claude Code (Fase 1); este flujo solo publica.
name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
    paths: ["output/**"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: output
      - id: deployment
        uses: actions/deploy-pages@v4
